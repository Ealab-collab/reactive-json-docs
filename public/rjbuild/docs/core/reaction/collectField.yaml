renderView:
  - type: Markdown
    content: |
      # Reaction: collectField

      The `collectField` reaction writes the values of one field of every item of a collection, as an array. Typical use: a "select all" checkbox that writes the identifiers of the listed items.

      ## Properties

  - type: DefinitionList
    content:
      - term:
          code: from
          after: "(string, required)"
        details: "The collection (template syntax), an array of objects."
      - term:
          code: field
          after: "(string, required)"
        details: "The name of the field to read in each item. It is evaluated."
      - term:
          code: path
          after: "(string, required)"
        details: "The location receiving the array (template syntax)."

  - type: Markdown
    content: |
      ## Behavior

      - The array of the `field` values is written at `path`, in the order of the collection.
      - The items that are not objects, and the items whose field is `null`, `undefined` or an empty string, are skipped.
      - A collection that is not an array writes an empty array.
      - The collection is read from the complete data, even inside a `DataFilter`.

  - type: RjBuildDescriber
    title: "Select all / deselect all"
    description: "collectField writes every nid of the results; setData empties the selection."
    toDescribe:
      renderView:
        - type: button
          attributes:
            type: button
            style:
              marginRight: "0.5rem"
          content: "Select all"
          actions:
            - what: collectField
              on: click
              from: ~~.results
              field: nid
              path: ~~.selection
        - type: button
          attributes:
            type: button
          content: "Deselect all"
          actions:
            - what: setData
              on: click
              path: ~~.selection
              value: []
        - type: div
          content:
            - type: strong
              content: "Selection: "
            - type: Join
              content: ~~.selection
              separator: ", "
      data:
        results:
          - nid: 4
            title: "First"
          - nid: 9
            title: "Second"
          - nid: 15
            title: "Third"
        selection: []

  - type: Markdown
    content: |
      ## Limitations

      - Only a direct field of the items is read (no nested path such as `author.id`).
