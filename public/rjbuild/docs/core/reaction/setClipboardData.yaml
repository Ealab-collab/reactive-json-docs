renderView:
  - type: Markdown
    content: |
      # Reaction: setClipboardData

      The `setClipboardData` reaction copies a specified value to the user's clipboard.

      ## Properties

  - type: DefinitionList
    content:
      - term:
          code: value
          after: "(any, required)"
        details:
          type: Markdown
          content: "The value to be copied to the clipboard. The value is evaluated, so it can be a literal string or a path to data"
      - term:
          code: statusPath
          after: "(string, optional)"
        details:
          type: Markdown
          content: "A location receiving `\"copied\"` or `\"failed\"` once the copy is done, so that the page can react to the outcome."

  - type: Markdown
    content: |
      ## Behavior

      - When triggered, the reaction evaluates the `value` property.
      - A string or a number is copied with the `navigator.clipboard.writeText()` API. Other values (objects, arrays) and empty values are ignored.
      - Outside a secure context (plain http on a host other than `localhost`), where the Clipboard API is not available, or when it fails, the copy falls back to the deprecated `copy` command on a temporary text field.
      - An error is logged to the console if the copy fails, and `statusPath` receives `"failed"`.

      ## Limitations

      - The user may be prompted for permission to access the clipboard, depending on browser settings.
      - Only strings and numbers are copied: objects and arrays are ignored.

  - type: RjBuildDescriber
    title: "Copying text to the clipboard"
    description: "This example shows a button that, when clicked, copies the value of `~.shareable_code` to the clipboard."
    toDescribe:
      renderView:
        - type: div
          content: ["Your code: ", ~.shareable_code]
        - type: button
          content: "Copy Code"
          actions:
            - what: setClipboardData
              on: click
              value: ~.shareable_code
              statusPath: ~.copyStatus
        - type: span
          attributes:
            style:
              marginLeft: "0.5rem"
          content: ["Status: ", ~.copyStatus]
      data:
        shareable_code: "ABC-123-XYZ"
        copyStatus: "" 