renderView:
  - type: Markdown
    content: |
      # Reaction: redirectNow

      The `redirectNow` reaction performs an immediate browser redirection to a specified URL.

      ## Properties

  - type: DefinitionList
    content:
      - term:
          code: to
          after: "(string or array, required)"
        details:
          type: Markdown
          content: "The URL to redirect to: a string or a template reference, or an array of segments built like the `src` of `additionalDataSource` (literal strings, references evaluated in the current template context, `{segment, required}`, `{param, value, required}`). See *Dynamic URLs with `src` as Array* in [RjBuild structure](../../getting-started/rjbuild-structure)."
      - term:
          code: replace
          after: "(boolean, optional)"
        details: "When true, the current history entry is replaced instead of adding a new one (the back button does not come back to the current page). Default: false."

  - type: Markdown
    content: |
      ## Behavior

      - When triggered, the reaction evaluates the `to` property to get the target URL.
      - It then sets `window.location.href` to the resulting URL (or calls `window.location.replace()` with `replace: true`), causing the browser to navigate to the new page.
      - Nothing happens when the URL is empty, or when a required segment is empty: the user is never sent to a truncated URL.

      ## URL built from a response

      After a creation, the URL of the new item is only known from the response:

      ```yaml
      - what: redirectNow
        on: response
        replace: true
        to:
          - "/dashboards/"
          - segment: "<reactive-json:event-new-value>.id"
            required: true
          - param: edit
            value: "1"
      ```

      ## Limitations

      - The `to` property must resolve to a valid URL string for the redirection to work.
      - This action causes a full page reload, which will reset the entire application state.

      **Note**: Since this example performs a real redirection, clicking the button will navigate you away from this page.

  - type: RjBuildDescriber
    title: "Redirecting to a URL"
    description: "This example shows a button that redirects the user to the Reactive-JSON GitHub page when clicked."
    toDescribe:
      renderView:
        - type: button
          content: "Visit GitHub"
          actions:
            - what: redirectNow
              on: click
              to: "https://github.com/reactive-json/reactive-json"
 