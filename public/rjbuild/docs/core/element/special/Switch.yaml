renderView:
  - type: Markdown
    content: |
      # Switch

      The `Switch` component allows you to render a list or collection of items using a template, with support for dynamic data, options, and pagination. It is useful for displaying arrays, lists, or collections where each item can be rendered with a specific template or configuration.

      ## Properties

  - type: DefinitionList
    content:
      - term:
          code: content
          after: "(object|array|string, required)"
        details:
          type: Markdown
          content: "Data or path to the data to iterate over."
      - term:
          code: options
          after: "(object, optional)"
        details: "Mapping of keys to templates for rendering each item (used for object/array of objects)."
      - term:
          code: singleOption
          after: "(object, optional)"
        details: "Template to use for each item when all items share the same structure."
      - term:
          code: cardinality
          after: "(number, optional)"
        details: "Maximum number of items to render (default: unlimited)."
      - term:
          code: paginated
          after: "(boolean, optional)"
        details: "Whether to enable pagination (default: false)."
      - term:
          code: paginationProps
          after: "(object, optional)"
        details: "Pagination configuration (page size, etc.)."
      - term:
          code: before
          after: "(object, optional)"
        details: "Content to render before the list."
      - term:
          code: after
          after: "(object, optional)"
        details: "Content to render after the list."
      - term:
          code: contentWrapper
          after: "(object, optional)"
        details:
          type: Markdown
          content: |
            HTML element configuration to wrap the main content (items only, not before/after):
            - `tag` (string, optional): HTML tag name (default: `div`)
            - `attributes` (object, optional): HTML attributes to apply to the wrapper element (supports template evaluation)

  - type: Markdown
    content: |
      ## Behavior
      - Iterates over the provided data and renders each item using the specified template(s).
      - If `options` is provided, uses the corresponding template for each key.
      - If `singleOption` is provided, uses the same template for all items.
      - Supports limiting the number of items with `cardinality`.
      - Supports pagination if `paginated` is true.
      - Renders optional `before` and `after` content
      - Can wrap the main content (items) with a custom HTML element using `contentWrapper`

      ## Content Wrapper Feature

      The `contentWrapper` property allows you to wrap the rendered items in a custom HTML element without affecting the `before` and `after` content. This is particularly useful for applying CSS layouts like Grid or Flexbox to the items.

      **Note**: The `attributes` property of `contentWrapper` supports template evaluation, allowing you to create dynamic wrapper configurations based on your data.

      ### Structure
      ```
      before (optional)
      └── contentWrapper (optional)
          └── rendered items
      after (optional)
      ```

      The wrapper only affects the main content items and does not interfere with pagination or other Switch features.

      ## Example
      ```yaml
      renderView:
        - type: Switch
          content: ~.users
          singleOption:
            load: opt
          paginated: true
          paginationProps:
            pageMaxItemCount: 2
      templates:
        opt:
          type: div
          content: ~.name
      data:
        users:
          - name: "Alice"
          - name: "Bob"
          - name: "Charlie"
          - name: "Diana"
      ```

      ## Limitations
      - The data must be an array or object; strings and numbers are not supported
      - If both `options` and `singleOption` are provided, `singleOption` takes precedence
      - No built-in support for filtering or sorting (use DataFilter or custom logic)
      - Pagination requires the `paginated` property to be set to true

      ### Data Structure Requirements
      Switch requires each item in the data to be an object, not a primitive value:

      ```yaml
      # ❌ This will NOT work:
      data:
        items: ["string1", "string2", "string3"]

      # ✅ This will work:
      data:
        items:
          - name: "string1"
          - name: "string2"
          - name: "string3"
      ```

      ## Caveats — common pitfalls that fail silently

      Two patterns *look* correct, throw no error, and produce empty output.
      They've cost real debugging time.

      ### Caveat 1 — `content` must be a template reference, not an inline array

      Switch iterates whatever you put in `content`, but the per-item
      template context is fetched from the **reactive data store** at the
      iterated path. An inline array literal in `content` is never written
      to the store, so each iteration's `templateData` ends up `undefined`
      and every `~.field` resolves to nothing.

      ```yaml
      # ❌ Silent failure — items render but ~.label is undefined
      renderView:
        - type: Switch
          content:
            - {label: "Home"}
            - {label: "About"}
          singleOption:
            load: navLink
      templates:
        navLink:
          type: a
          content: ~.label
      ```

      ```yaml
      # ✅ Works — content points into the store
      data:
        navItems:
          - {label: "Home"}
          - {label: "About"}
      renderView:
        - type: Switch
          content: ~~.navItems
          singleOption:
            load: navLink
      templates:
        navLink:
          type: a
          content: ~.label
      ```

      **Rule of thumb:** `Switch.content` is always a path reference
      (`~~.foo` for global, `~.foo` for local), never a literal. Constant
      iteration data belongs in the YAML's `data:` section.

      ### Caveat 2 — `singleOption` must use `load:`, not an inline template

      The per-item TemplateContext that makes `~.field` resolve against the
      current item is set up by the `load` branch of the View engine.
      Writing `singleOption` as an inline `{type: ..., content: ...}` skips
      that setup — the iteration happens, but `~.field` resolves against
      the **outer** context, not the per-item context.

      ```yaml
      # ❌ ~.name resolves against the outer context
      renderView:
        - type: Switch
          content: ~~.users
          singleOption:
            type: div
            content: ~.name
      ```

      ```yaml
      # ✅ Per-item context is correctly pushed
      renderView:
        - type: Switch
          content: ~~.users
          singleOption:
            load: userCard
      templates:
        userCard:
          type: div
          content: ~.name
      ```

      **Rule of thumb:** treat `singleOption` and `options.<key>` as
      `{load: <templateName>}` only. Factor inline templates into
      `templates:`.

      ### Debugging checklist when an iteration renders empty

      1. Is `Switch.content` a `~~.path` (not an inline literal)?
      2. Does that path exist in the store? (Defaults in `data:` are merged
         in unless the parent mounts with a `dataOverride` that omits the
         field.)
      3. Is `singleOption` / `options.<key>` a `{load: <name>}`?
      4. Is each item in the data an object (not a primitive)? Switch
         silently skips non-object entries.
      5. Is the `usePagination` hook available? Switch returns `null` if
         not — normally guaranteed by `ReactiveJsonRoot` auto-merging
         `coreComponentsPlugin`.

  - type: RjBuildDescriber
    title: "Simple usage with `singleOption` (no pagination)"
    description: |
      This example shows a basic Switch rendering a list of users with a single template.
    toDescribe:
      renderView:
        - type: Switch
          content: ~.users
          singleOption:
            load: opt
      templates:
        opt:
          type: div
          content: ~.name
      data:
        users:
          - name: "Alice"
          - name: "Bob"
          - name: "Charlie"

  - type: RjBuildDescriber
    title: "Usage with `options` (different templates per key)"
    description: |
      This example shows how to use different templates for each key in the data.
    toDescribe:
      renderView:
        - type: Switch
          content: ~.items
          options:
            name:
              load: name
            age:
              load: age
      templates:
        name:
          type: div
          content: [ "Name: ", ~.value ]
        age:
          type: div
          content: [ "Age: ", ~.value ]
      data:
        items:
          - name:
              value: "Alice"
          - age:
              value: 30
          - name:
              value: "Bob"
          - age:
              value: 25

  - type: RjBuildDescriber
    title: "Usage with `singleOption` and pagination (4 per page, 10 items)"
    description: |
      This example demonstrates pagination with 4 items per page and 10 items in total. PageControls is added to the end of the list.
    toDescribe:
      renderView:
        - type: Switch
          content: ~.numbers
          singleOption: { load: opt }
          paginated: true
          paginationProps:
            pageMaxItemCount: 4
          before:
            type: div
            content: "User list:"
          after:
            type: PageControls
      templates:
        opt:
          type: div
          content: [ "Number: ", ~.value ]
      data:
        numbers:
          - value: 1
          - value: 2
          - value: 3
          - value: 4
          - value: 5
          - value: 6
          - value: 7
          - value: 8
          - value: 9
          - value: 10

  - type: RjBuildDescriber
    title: "Usage with `contentWrapper` for CSS Grid Layout"
    description: |
      This example demonstrates how to use contentWrapper to apply a CSS Grid layout to the Switch items.
    toDescribe:
      renderView:
        - type: Switch
          content: ~.products
          singleOption:
            load: productCard
          contentWrapper:
            tag: div
            attributes:
              style:
                display: grid
                gridTemplateColumns: "repeat(auto-fill, minmax(200px, 1fr))"
                gap: 1rem
                padding: 1rem
                border: "1px solid currentColor"
                borderRadius: 8px
          before:
            type: h3
            content: "Our Products"
          after:
            type: div
            attributes:
              style:
                textAlign: center
                marginTop: 1rem
            content: "End of product list"
      templates:
        productCard:
          type: div
          attributes:
            style:
              border: "1px solid currentColor"
              borderRadius: 8px
              padding: 1rem
              textAlign: center
          content:
            - type: h4
              attributes:
                style:
                  margin: "0 0 0.5rem 0"
              content: ~.name
            - type: p
              attributes:
                style:
                  margin: 0
                  fontSize: "0.9rem"
                  opacity: 0.8
              content: ~.description
      data:
        products:
          - name: "Product A"
            description: "High-quality product A"
          - name: "Product B"
            description: "Reliable product B"
          - name: "Product C"
            description: "Premium product C"
          - name: "Product D"
            description: "Affordable product D"

  - type: RjBuildDescriber
    title: "Usage with `contentWrapper` and Pagination"
    description: |
      This example shows how contentWrapper works seamlessly with pagination.
    toDescribe:
      renderView:
        - type: Switch
          content: ~.cards
          singleOption:
            load: card
          paginated: true
          paginationProps:
            pageMaxItemCount: 3
          contentWrapper:
            tag: section
            attributes:
              class: "card-grid"
              style:
                display: flex
                flexWrap: wrap
                gap: 1rem
                justifyContent: center
                padding: 1rem
                border: "2px dashed currentColor"
                borderRadius: 8px
          after:
            type: PageControls
      templates:
        card:
          type: div
          attributes:
            style:
              flex: "0 1 150px"
              padding: 1rem
              border: "1px solid currentColor"
              borderRadius: 8px
              textAlign: center
          content: ~.title
      data:
        cards:
          - title: "Card 1"
          - title: "Card 2"
          - title: "Card 3"
          - title: "Card 4"
          - title: "Card 5"
          - title: "Card 6"
          - title: "Card 7"

  - type: RjBuildDescriber
    title: "Dynamic `contentWrapper` with Template Evaluation"
    description: |
      This example demonstrates how contentWrapper attributes can use template evaluation to create dynamic layouts.
    toDescribe:
      renderView:
        - type: Switch
          content: ~.items
          singleOption:
            load: dynamicCard
          contentWrapper:
            tag: section
            attributes:
              class: ~.wrapperConfig.cssClass
              style:
                display: grid
                gridTemplateColumns: ~.wrapperConfig.columns
                gap: ~.wrapperConfig.spacing
                padding: ~.wrapperConfig.padding
                border: ~.theme.border
                borderRadius: ~.theme.borderRadius
          before:
            type: h3
            attributes:
              style:
                textAlign: center
                fontWeight: bold
            content: ~.title
      templates:
        dynamicCard:
          type: div
          attributes:
            style:
              padding: 1rem
              border: ~.theme.cardBorder
              borderRadius: 6px
              textAlign: center

          content: ~.name
      data:
        title: "Dynamic Gallery"
        wrapperConfig:
          cssClass: "dynamic-gallery"
          columns: "repeat(auto-fit, minmax(150px, 1fr))"
          spacing: "1.5rem"
          padding: "2rem"
        theme:
          border: "2px solid currentColor"
          borderRadius: "12px"
        items:
          - name: "Element A"
          - name: "Element B"
          - name: "Element C"
          - name: "Element D"
