renderView:
  - type: Markdown
    content: |
      # DataFilter

      The `DataFilter` component allows you to filter data from the global or template context before rendering its content. It is particularly useful for conditional display of elements based on dynamic complex criteria, such as filtering lists, trees, or data subsets.

      ## Properties

  - type: DefinitionList
    content:
      - term:
          code: filters
          after: "(array, required)"
        details:
          - type: Markdown
            content: "Array of filter objects, each specifying properties and conditions to check:"
          - type: DefinitionList
            content:
              - term:
                  code: subjectsWithProperty
                  after: "(string)"
                details: Property to check in the data, acts as namespace.
              - term:
                  code: andConditions
                  after: "(array)"
                details: List of conditions that must all be true.
              - term:
                  code: orConditions
                  after: "(array)"
                details: List of conditions where at least one must be true.
              - term:
                  code: availableConditions
                  after: "(info)"
                details:
                  type: Markdown
                  content: |
                    Available condition keys inside conditions objects:
                    - `when`: Checks a condition on a value.
                    - `is`: Compares exact equality.
                    - `isNot`: Checks inequality.
                    - `isEmpty`: Checks if a value is empty.
                    - `isNotEmpty`: Checks if a value is not empty.
                    - `contains`: Checks if a value contains a substring.
                    - `>=`, `<=`, `>`, `<`: Numeric comparisons.
                    - `compareAsDates`: Boolean to compare values as dates.
                    - `whenFilterableData`: Specifies the data path to filter, must include the namespace.
      - term:
          code: context
          after: "(string, optional)"
        details:
          type: Markdown
          content: "Context to filter (`global` or `template`). Default: `global`."
      - term:
          code: content
          after: "(object|array, required)"
        details: Content to render after filtering.

  - type: Markdown
    content: |
      ## Behavior
      - Applies all filters to the selected context before content rendering.
      - Supports complex filtering conditions with `andConditions` and `orConditions`.
      - Allows recursive filtering while preserving data structure.
      - Can be combined with other components to create interactive filtering interfaces.
      - Supports dynamic filtering based on application state

      ## Filterable Data Structure
      
      DataFilter uses a specific pattern to identify and filter data. This pattern relies on an identification key (namespace) that must be consistent between the data structure and filtering conditions.
      
      ### Namespace Pattern
      
      1. **In the data structure**:
      ```yaml
      data:
        filteredItems:
          - item:           # <- Identification key (namespace)
              id: 1
              title: "..."
          - item:           # <- Same key for each item
              id: 2
              title: "..."
      ```
      
      2. **In filtering conditions**:
      ```yaml
      type: DataFilter
      context: global
      filters:
        - subjectsWithProperty: item    # <- Declares the namespace
          andConditions:
            - orConditions:
                - whenFilterableData: item.title  # <- Uses the namespace
                  contains: "..."
      ```
      
      The identification key (here "item"):
      - Can have any name (`itemXyz`, `element`, etc.).
      - Must be consistent between data structure and conditions.
      - Serves as a namespace for accessing properties in `whenFilterableData`.
      - Is required for DataFilter to correctly identify filterable elements.

  - type: RjBuildDescriber
    title: Advanced Example
    toDescribe:
      renderView:
        - type: div
          attributes:
            class: "container-fluid"
          content:
            - type: div
              attributes:
                class: "row mb-4"
              content:
                - type: div
                  attributes:
                    style:
                      width: "48%"
                      display: "inline-block"
                      verticalAlign: "top"
                      marginRight: "2%"
                  content:
                    - type: div
                      attributes:
                        class: "card h-100"
                      content:
                        - type: div
                          attributes:
                            class: "card-header bg-secondary text-white"
                          content:
                            - type: h5
                              attributes:
                                class: "card-title mb-0"
                              content: "📋 All Items (Unfiltered)"
                        - type: div
                          attributes:
                            class: "card-body"
                          content:
                            - type: div
                              attributes:
                                class: "list-group list-group-flush"
                              content:
                                type: Switch
                                content: ~.filteredItems
                                singleOption:
                                  load: item
                - type: div
                  attributes:
                    style:
                      width: "48%"
                      display: "inline-block"
                      verticalAlign: "top"
                      marginRight: "2%"
                  content:
                    - type: div
                      attributes:
                        class: "card h-100"
                      content:
                        - type: div
                          attributes:
                            class: "card-header bg-primary text-white"
                          content:
                            - type: h5
                              attributes:
                                class: "card-title mb-0"
                              content: "🔍 Filtered Results"
                        - type: div
                          attributes:
                            class: "card-body"
                          content:
                            - type: DataFilter
                              context: global
                              filters:
                                - subjectsWithProperty: item
                                  andConditions:
                                    # Text search filter
                                    - orConditions:
                                        - when: ~~._filters.search
                                          isEmpty:
                                        - whenFilterableData: item.searchableContent
                                          contains: ~~._filters.search

                                    # Date filter
                                    - orConditions:
                                        - when: ~~._filters.since
                                          isEmpty:
                                        - whenFilterableData: item.creationDate
                                          ">=": ~~._filters.since
                                          compareAsDates: true

                                    # Status filter
                                    - orConditions:
                                        - when: ~~._filters.status
                                          isNot: active_only
                                        - whenFilterableData: item.status
                                          is: active

                              content:
                                - type: div
                                  attributes:
                                    class: "list-group list-group-flush"
                                  content:
                                    type: Switch
                                    content: ~~.filteredItems
                                    singleOption:
                                      load: item
            - type: div
              attributes:
                class: "row mt-4"
              content:
                - type: div
                  attributes:
                    style:
                      width: "100%"
                  content:
                    - type: div
                      attributes:
                        class: "card"
                      content:
                        - type: div
                          attributes:
                            class: "card-header bg-info text-white"
                          content:
                            - type: h5
                              attributes:
                                class: "card-title mb-0"
                              content: "⚙️ Filter Controls"
                        - type: div
                          attributes:
                            class: "card-body"
                          content:
                            # Filtering interface
                            - type: div
                              attributes:
                                class: "row g-3"
                              content:
                                - type: div
                                  attributes:
                                    style:
                                      width: "32%"
                                      display: "inline-block"
                                      verticalAlign: "top"
                                      marginRight: "1%"
                                  content:
                                    - type: input
                                      attributes:
                                        type: "text"
                                        placeholder: "Search..."
                                        value: ~~._filters.search
                                        style:
                                          padding: "8px"
                                          border: "1px solid #ccc"
                                          borderRadius: "4px"
                                          width: "100%"
                                      actions:
                                        - what: setData
                                          on: input
                                          path: ~~._filters.search
                                          value: "<reactive-json:event-new-value>"
                                - type: div
                                  attributes:
                                    style:
                                      width: "32%"
                                      display: "inline-block"
                                      verticalAlign: "top"
                                      marginRight: "1%"
                                  content:
                                    - type: input
                                      attributes:
                                        type: "date"
                                        value: ~~._filters.since
                                        style:
                                          padding: "8px"
                                          border: "1px solid #ccc"
                                          borderRadius: "4px"
                                      actions:
                                        - what: setData
                                          on: input
                                          path: ~~._filters.since
                                          value: "<reactive-json:event-new-value>"
                                - type: div
                                  attributes:
                                    style:
                                      width: "32%"
                                      display: "inline-block"
                                      verticalAlign: "top"
                                      marginRight: "1%"
                                  content:
                                    - type: select
                                      attributes:
                                        value: ~~._filters.status
                                        style:
                                          padding: "8px"
                                          border: "1px solid #ccc"
                                          borderRadius: "4px"
                                          width: "100%"
                                      content:
                                        - type: option
                                          attributes:
                                            value: "all"
                                          content: "All"
                                        - type: option
                                          attributes:
                                            value: "active_only"
                                          content: "Active only"
                                      actions:
                                        - what: setData
                                          on: change
                                          path: ~~._filters.status
                                          value: "<reactive-json:event-new-value>"

      templates:
        item:
          type: div
          attributes:
            style:
              display: "flex"
              justifyContent: "space-between"
              alignItems: "center"
              padding: "16px 0"
              borderTop: "1px solid #ddd"
              borderBottom: "1px solid #ddd"
          content:
            - type: div
              attributes:
                style:
                  display: "flex"
                  alignItems: "center"
                  gap: "12px"
              content:
                - type: input
                  attributes:
                    type: "checkbox"
                    checked: ~.item.isSelected
                    style:
                      margin: "0 8px 0 0"
                  actions:
                    - what: setData
                      on: change
                      path: ~.item.isSelected
                      value: "<reactive-json:event-new-value>"
                - type: div
                  attributes:
                    style:
                      display: "flex"
                      flexDirection: "column"
                  content:
                    - type: div
                      attributes:
                        style:
                          fontWeight: "bold"
                          marginBottom: "4px"
                      content: ~.item.searchableContent
                    - type: div
                      attributes:
                        style:
                          color: "#6c757d"
                          fontSize: "0.875rem"
                      content: ~.item.creationDate
            - type: div
              attributes:
                style:
                  display: "flex"
                  gap: "8px"
              content:
                - type: span
                  attributes:
                    style:
                      border: "1px solid #198754"
                      padding: "4px 8px"
                      borderRadius: "12px"
                      fontSize: "0.75rem"
                  content: ~.item.status
                  actions:
                    - what: hide
                      when: ~.item.status
                      isNot: active
                - type: span
                  attributes:
                    style:
                      border: "1px solid #dc3545"
                      padding: "4px 8px"
                      borderRadius: "12px"
                      fontSize: "0.75rem"
                  content: ~.item.status
                  actions:
                    - what: hide
                      when: ~.item.status
                      is: active
      data:
        _filters:
          search: ""
          since: ""
          status: "all"
        filteredItems:
          - item:
              id: 1
              searchableContent: "First item"
              status: "active"
              creationDate: "2024-03-20"
              isSelected: true
          - item:
              id: 2
              searchableContent: "Second item"
              status: "inactive"
              creationDate: "2024-03-19"
              isSelected: false

  - type: Markdown
    content: |
      ## Advanced Use Cases
      - Multi-criteria filtering with combined conditions.
      - Real-time search interface.
      - Hierarchical data filtering (trees, sub-elements).
      - Complex state management (conflicts, modifications, new elements).
      - Integration with pagination components.
      - Date-based filtering and numeric comparisons.

      ## Best Practices
      - Organize filters by logical category.
      - Use comments to document complex conditions.
      - Combine with UI components for interactive experience.
      - Consider performance with large datasets.
      - Use reusable templates for common filters.

      ## Limitations
      - Filtering is based on simple comparisons.
      - Performance may be impacted with very large datasets.
      - Does not support custom filtering functions.
      - Filtering is applied recursively on the entire structure.