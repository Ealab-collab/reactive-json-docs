renderView:
  - type: Markdown
    content: |
      # Html

      The `Html` component renders any HTML tag with static attributes and content. Use it to create custom wrappers, sections, or inject arbitrary tags with full template support.

      **Note:** The `tag` property must be a static string. It cannot be set dynamically via template or data.

      ## Properties

  - type: DefinitionList
    content:
      - term:
          code: tag
          after: "(string, required)"
        details:
          type: Markdown
          content: "The HTML tag to render (e.g., div, span, section)."
      - term:
          code: attributes
          after: "(object, optional)"
        details: "Attributes for the tag (class, id, etc.)."
      - term:
          code: content
          after: "(object|array, optional)"
        details: "Content to render inside the tag (any Reactive-JSON view or array)."
      - term:
          code: extra
          after: "(object, optional)"
        details: "Additional content rendered after the main tag."

  - type: BsAlert
    attributes:
      variant: info
    content:
      - "In most cases, you do not need to use the Html component directly. It is more convenient to use 'type: tagName' (e.g., 'type: div', 'type: span') instead of 'type: Html, tag: tagName'. The Html component is used internally by the engine as a fallback when no specific component is found for a given type."

  - type: RjBuildDescriber
    title: "Interactive Example: Custom HTML tag (static tag only)"
    description:
      - type: Markdown
        content: |
          Change the priority and content to see how the Html component renders dynamic HTML.
    toDescribe:
      renderView:
        - type: div
          content:
            - type: SelectField
              dataLocation: ~.class
              label: "Priority:"
              options:
                - label: "Normal"
                  value: ""
                - label: "Important (blue)"
                  value: "text-primary"
                - label: "Warning (orange)"
                  value: "text-warning"
                - label: "Critical (red)"
                  value: "text-danger"
            - type: TextField
              dataLocation: ~.txt
              label: "Content"
        - type: div
          content:
            type: strong
            content: "Rendered:"
        - type: Html
          tag: div
          attributes:
            class: ~.class
          content: ~.txt
      data:
        class: ""
        txt: Hello world!

  - type: Markdown
    content: |
      ## URL attributes

      The URL attributes (`href`, `src`, `action`, `formAction`, `poster`) accept an array of segments, in the format of the `src` of `additionalDataSource` (see *Dynamic URLs with `src` as Array* in [RjBuild structure](../../getting-started/rjbuild-structure)). The references are evaluated in the current template context, so each item of a `Switch` gets its own URL:

      ```yaml
      - type: a
        attributes:
          href:
            - "/article/"
            - ~.year
            - "/"
            - segment: ~.slug
              required: true
        content: ~.title
      ```

      When a required segment is empty, the attribute is omitted. An array in another attribute is evaluated as before (each item separately).

  - type: Markdown
    content: |
      ## Form controls

      `input`, `textarea` and `select` elements are rendered as **controlled** React elements: their `value` defaults to `""`.

      A checkbox or radio `input` is controlled by its `checked` attribute, which defaults to `false`. Without a binding, the input never shows as checked, whatever its reactions do to the data. Bind it to the data:

      - a boolean: `checked: ~.isSelected` (a falsy value leaves the input unchecked);
      - a comparison or a list membership: an `attributeTransforms` entry setting `checked`, with a condition (`is`, `contains`...).

      ```yaml
      - type: input
        attributes:
          type: checkbox
          value: ~.label
        attributeTransforms:
          - what: setAttributeValue
            name: checked
            mode: replace
            value: true
            when: ~~.lead.sessions
            contains: ~.label
      ```

      A warning is logged when a checkbox or radio has event reactions (`on: change`...) but neither a `checked` attribute nor an attribute transform on `checked`. To store a value or a list of values, prefer [CheckBoxField](../form/CheckBoxField), which binds `checked` itself.

  - type: Markdown
    content: |
      ## Limitations
      - The `tag` property does not support template evaluation and must be a static string.
      - No validation of tag names; invalid tags may cause rendering errors.
      - No support for dangerouslySetInnerHTML (use PreformattedMarkup for raw HTML).
      - No built-in support for event handlers (use actions system for interactivity).
      - No automatic support for custom attributes beyond React's attribute normalization.